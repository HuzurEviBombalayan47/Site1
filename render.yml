services:
  - type: web
    name: Site1
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: |
      pip install -r requirements.txt
      cd frontend
      npm install
      npm run build
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: ./backend
